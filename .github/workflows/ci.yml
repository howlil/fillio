name: CI

on:
  push:
    branches: ['master', 'feat/**', 'fix/**', 'chore/**']
  pull_request:
    branches: ['master']

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install
      - name: Format source
        run: npm run format
      - name: Test
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Verify generated extension
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('.output/chrome-mv3/manifest.json', 'utf8'));
          if (manifest.manifest_version !== 3) throw new Error(`Expected MV3, received ${manifest.manifest_version}`);
          const permissions = [...(manifest.permissions ?? [])].sort();
          if (JSON.stringify(permissions) !== JSON.stringify(['storage'])) {
            throw new Error(`Unexpected permissions: ${JSON.stringify(permissions)}`);
          }
          if (!manifest.action?.default_popup) throw new Error('Popup entrypoint missing from manifest');
          if (!manifest.options_ui?.page && !manifest.options_page) throw new Error('Options entrypoint missing from manifest');
          NODE
      - name: Package extension
        run: npm run zip
      - name: Format check
        run: npm run format:check
      - name: Persist normalized workspace
        if: github.ref == 'refs/heads/feat/iteration-1-profile'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src entrypoints package-lock.json
          if git diff --cached --quiet; then
            echo "Workspace is already normalized."
          else
            git commit -m "chore: normalize iteration 1 workspace"
            git push origin HEAD:feat/iteration-1-profile
          fi
