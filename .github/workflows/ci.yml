name: CI

on:
  pull_request:
    branches: ['master']

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 2

      - uses: pnpm/action-setup@v5
        with:
          version: 11.21.0
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply exact repository formatting
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write src/components/ui/button.tsx src/components/floating/floating-styles.ts

          if git diff --quiet -- src/components/ui/button.tsx src/components/floating/floating-styles.ts; then
            echo "Formatting already clean."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ui/button.tsx src/components/floating/floating-styles.ts
          git commit -m "fix(ui): apply prettier formatting"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
