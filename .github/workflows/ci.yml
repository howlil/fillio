name: CI

on:
  push:
    branches: ['master', 'feat/**', 'fix/**', 'chore/**']
  pull_request:
    branches: ['master']

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format sources
        run: npm run format
      - name: Commit formatting
        if: github.ref == 'refs/heads/feat/iteration-3-dynamic-corrections'
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add e2e/iteration3-dynamic.mjs entrypoints/content.tsx src/domain/corrections/correction-memory.test.ts src/infrastructure/dom/dynamic-forms.test.ts src/infrastructure/dom/observe-form-mutations.ts src/ui/floating/FloatingPanel.review.test.tsx src/ui/floating/FloatingPanel.tsx
            git commit -m 'style: format iteration 3 changes'
            git push origin HEAD:feat/iteration-3-dynamic-corrections
          fi
      - name: Format check
        run: npm run format:check
      - name: Build
        run: npm run build
      - name: Verify generated extension
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('.output/chrome-mv3/manifest.json', 'utf8'));
          if (manifest.manifest_version !== 3) throw new Error(`Expected MV3, received ${manifest.manifest_version}`);
          const permissions = [...(manifest.permissions ?? [])].sort();
          if (JSON.stringify(permissions) !== JSON.stringify(['storage'])) {
            throw new Error(`Unexpected permissions: ${JSON.stringify(permissions)}`);
          }
          const hostPermissions = [...(manifest.host_permissions ?? [])].sort();
          if (hostPermissions.length !== 0) {
            throw new Error(`Unexpected host_permissions: ${JSON.stringify(hostPermissions)}`);
          }
          const matches = [...new Set((manifest.content_scripts ?? []).flatMap((script) => script.matches ?? []))].sort();
          const expectedMatches = ['http://*/*', 'https://*/*'].sort();
          if (JSON.stringify(matches) !== JSON.stringify(expectedMatches)) {
            throw new Error(`Unexpected content-script matches: ${JSON.stringify(matches)}`);
          }
          if (!manifest.action?.default_popup) throw new Error('Popup entrypoint missing from manifest');
          if (!manifest.options_ui?.page && !manifest.options_page) throw new Error('Options entrypoint missing from manifest');
          NODE
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser extension smoke test
        run: npm run test:e2e
      - name: Package extension
        run: npm run zip
